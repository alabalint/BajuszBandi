<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bajusz Bandi történetei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root{
    --bg:#FBF3E7;
    --paper:#FFFDF8;
    --ink:#4A3728;
    --ink-soft:#8A7860;
    --accent:#C0392B;
    --accent-2:#2F7A4F;
    --gold:#E8A33D;
    --line:#E9DCC6;
    --shadow: 0 18px 40px -18px rgba(74,55,40,0.35);
    --font-display:'Baloo 2', ui-rounded, 'Segoe UI', sans-serif;
    --font-body:'Nunito', 'Segoe UI', sans-serif;
  }

  *{box-sizing:border-box;}
  html{ background:var(--bg); }
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    padding-block: max(24px, env(safe-area-inset-top,0px)) max(32px, env(safe-area-inset-bottom,0px));
    padding-left:16px;
    padding-right:16px;
    background-image:
      radial-gradient(circle at 8% 12%, rgba(232,163,61,0.14), transparent 42%),
      radial-gradient(circle at 92% 85%, rgba(47,122,79,0.10), transparent 40%);
  }

  .stagewrap{
    max-width:640px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .eyebrow{
    text-align:center;
    font-family:var(--font-display);
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-size:0.78rem;
    color:var(--accent-2);
    margin:0;
  }

  .topbar{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; }
  .backlink{
    justify-self:start;
    font-family:var(--font-display);
    font-weight:700;
    font-size:0.95rem;
    color:var(--accent-2);
    text-decoration:none;
    padding:6px 12px;
    border-radius:999px;
    background:var(--paper);
    border:1px solid var(--line);
    white-space:nowrap;
  }
  .backlink:hover{ background:#fff; }
  .backlink:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

  .book{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .page-frame{ position:relative; }

  .page{ display:flex; flex-direction:column; gap:0; }
  .page[hidden]{ display:none; }

  .illus{
    margin:0;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--line);
    background:#eee;
  }
  .illus img{ display:block; width:100%; height:auto; }

  .story-text{
    padding:18px 10px 6px;
    text-align:center;
  }
  .story-text h2{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.28rem;
    margin:0 0 8px;
    color:var(--accent);
    text-wrap:balance;
  }
  .story-text p{
    font-size:1.05rem;
    line-height:1.6;
    margin:0 auto;
    max-width:52ch;
    color:var(--ink);
  }
  .story-text p + p{ margin-top:10px; }

  .cover .story-text{ padding-top:14px; }
  .cover h1, .hero h1{
    font-family:var(--font-display);
    font-weight:800;
    font-size:1.7rem;
    line-height:1.15;
    margin:0 0 8px;
    color:var(--accent);
    text-wrap:balance;
  }
  .cover .subtitle, .hero .subtitle{
    font-family:var(--font-body);
    font-weight:700;
    font-size:1rem;
    color:var(--ink-soft);
    margin:0;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
  }
  .navbtn{
    width:52px; height:52px;
    border-radius:50%;
    border:none;
    background:var(--accent-2);
    color:#fff;
    font-size:1.3rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 18px -8px rgba(47,122,79,0.6);
    transition:transform 0.15s ease, opacity 0.15s ease;
  }
  .navbtn:hover:not(:disabled){ transform:translateY(-2px); }
  .navbtn:active:not(:disabled){ transform:translateY(0); }
  .navbtn:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  .navbtn:disabled{ opacity:0.32; cursor:default; box-shadow:none; }

  .dots{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; max-width:280px; }
  .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--line);
    border:none; padding:0; cursor:pointer;
  }
  .dot[aria-current="true"]{ background:var(--accent); transform:scale(1.3); }
  .dot:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .pagenum{
    text-align:center;
    font-family:var(--font-display);
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0;
  }

  /* mesék választó */
  .hero{ text-align:center; padding:8px 0 4px; }
  .hero .eyebrow{ margin-bottom:6px; }
  .hero h1{ font-size:2rem; }
  .storylist{ display:flex; flex-direction:column; gap:18px; }
  .storycard{
    display:flex; flex-direction:column;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
    padding:14px;
    text-decoration:none;
    color:var(--ink);
    transition:transform 0.15s ease;
  }
  .storycard:hover{ transform:translateY(-3px); }
  .storycard:focus-visible{ outline:3px solid var(--gold); outline-offset:3px; }
  .storycard img{ display:block; width:100%; height:auto; aspect-ratio:4/3; object-fit:cover; object-position:center 62%; border-radius:14px; border:1px solid var(--line); }
  .storycard-body{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:14px 10px 6px; gap:4px; }
  .storycard-num{
    font-family:var(--font-display); font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
    font-size:0.75rem; color:var(--accent-2);
  }
  .storycard-title{
    font-family:var(--font-display); font-weight:800; font-size:1.4rem; line-height:1.15;
    color:var(--accent); text-wrap:balance;
  }
  .storycard-sub{ font-weight:700; font-size:0.95rem; color:var(--ink-soft); }

  @media (min-width:700px){
    .stagewrap:has(.storylist){ max-width:900px; }
    .storylist{ display:grid; grid-template-columns:1fr 1fr; }
  }

  @media (max-width:420px){
    .topbar .eyebrow{ font-size:0.68rem; letter-spacing:0.05em; }
    .backlink{ font-size:0.85rem; padding:5px 10px; }
    .cover h1{ font-size:1.4rem; }
    .hero h1{ font-size:1.6rem; }
    .story-text h2{ font-size:1.12rem; }
    .story-text p{ font-size:0.98rem; }
    .navbtn{ width:46px; height:46px; }
  }

  @media (prefers-reduced-motion: reduce){
    .navbtn, .storycard{ transition:none; }
  }

</style>
</head><body><div class="stagewrap">
  <header class="hero">
    <p class="eyebrow">Mesék a fal mögül</p>
    <h1>Bajusz Bandi történetei</h1>
    <p class="subtitle">Válassz egy mesét!</p>
  </header>
  <nav class="storylist" aria-label="Mesék">
    <a class="storycard" href="horgaszat.html">
      <img src="images/0oldal.jpg" alt="">
      <span class="storycard-body">
        <span class="storycard-num">1. mese</span>
        <span class="storycard-title">Bajusz Bandi és a vasárnapi horgászat</span>
        <span class="storycard-sub">Mese egy kedves manóról, aki a fal mögött lakik</span>
      </span>
    </a>
    <a class="storycard" href="polip.html">
      <img src="images/polip/0oldal.jpg" alt="">
      <span class="storycard-body">
        <span class="storycard-num">2. mese</span>
        <span class="storycard-title">Bajusz Bandi és a kis polip</span>
        <span class="storycard-sub">Mese egy bátor manóról és egy nagy tengeri kalandról</span>
      </span>
    </a>
  </nav>
</div>
</body></html>
